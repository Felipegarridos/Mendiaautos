<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&family=Michroma&display=swap" rel="stylesheet">
<script src="assets/inventario.js"></script>
<style>
  *{box-sizing:border-box}
  :root{--bg:#0c0c0e;--c-card:#161619;--c-input:#161619;--t-strong:#fff;--t-1:rgba(255,255,255,.8);--t-2:rgba(255,255,255,.58);--t-3:rgba(255,255,255,.42);--ln:rgba(255,255,255,.09);--ln-strong:rgba(255,255,255,.2)}
  body[data-theme="light"]{--bg:#fff;--c-card:#f6f6f7;--c-input:#f6f6f7;--t-strong:#0e0e10;--t-1:rgba(14,14,16,.82);--t-2:rgba(14,14,16,.56);--t-3:rgba(14,14,16,.44);--ln:rgba(0,0,0,.09);--ln-strong:rgba(0,0,0,.16)}
  body{margin:0;background:var(--bg);font-family:'Open Sans',system-ui,sans-serif;color:var(--t-1);transition:background .35s,color .35s}
  a{color:inherit;text-decoration:none}
  a:hover{color:#1E50A2}
  .mnd-mich{font-family:'Michroma',sans-serif}
  .mnd-row{display:grid;grid-template-columns:1fr auto auto auto;align-items:center;gap:14px;padding:16px 20px;border:1px solid var(--ln);border-radius:12px;background:var(--c-card);transition:border-color .25s}
  .mnd-row:hover{border-color:var(--ln-strong)}
  .mnd-badge{display:inline-flex;align-items:center;gap:7px;font:700 10px/1 'Open Sans',sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:7px 11px;border-radius:100px}
  .mnd-badge.disp{background:rgba(46,168,106,.14);color:#2fa86a}
  .mnd-badge.vend{background:rgba(30,80,162,.16);color:#2f6fd0}
  .mnd-toggle{border:1px solid var(--ln-strong);background:transparent;color:var(--t-strong);border-radius:9px;padding:11px 18px;font:700 10.5px/1 'Open Sans',sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:background .25s,color .25s,border-color .25s;white-space:nowrap}
  .mnd-toggle:hover{border-color:#1E50A2;color:#1E50A2}
  .mnd-edit-btn{border:1px solid var(--ln-strong);background:transparent;color:var(--t-2);border-radius:9px;padding:11px 14px;font:700 10.5px/1 'Open Sans',sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:all .25s;white-space:nowrap}
  .mnd-edit-btn:hover{border-color:#1E50A2;color:#1E50A2}
  .mnd-edit-panel{overflow:hidden;max-height:0;opacity:0;transition:max-height .45s cubic-bezier(.22,1,.36,1),opacity .35s ease,margin .35s ease}
  .mnd-edit-fld{width:100%;background:var(--c-input);border:1px solid var(--ln);border-radius:9px;padding:11px 13px;font:400 13px/1.4 'Open Sans',sans-serif;color:var(--t-strong);outline:none}
  .mnd-edit-fld:focus{border-color:#1E50A2}
  .mnd-elab{display:block;font:600 9px/1 'Open Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--t-3);margin-bottom:7px}
  .mnd-tabx{background:none;border:0;cursor:pointer;padding:10px 4px;font:700 12px/1 'Open Sans',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--t-3);border-bottom:2px solid transparent}
  .mnd-tabx.on{color:var(--t-strong);border-bottom-color:#1E50A2}
</style>
</helmet>
<div style="background:var(--bg);width:100%;max-width:1280px;margin:0 auto;overflow:hidden">

  <header style="position:sticky;top:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:16px 34px;border-bottom:1px solid var(--ln)">
    <a href="MendiautosHome.dc.html" style="display:flex;align-items:center;gap:12px;flex:1"><span style="display:flex;flex-direction:column;gap:4px"><span style="width:22px;height:2px;background:var(--t-strong)"></span><span style="width:22px;height:2px;background:var(--t-strong)"></span><span style="width:22px;height:2px;background:var(--t-strong)"></span></span><span style="font:600 12px/1 'Open Sans',sans-serif;letter-spacing:.24em;color:var(--t-2)">MENÚ</span></a>
    <a href="MendiautosHome.dc.html" style="flex:0 0 auto"><img src="assets/logo-word.png" alt="MENDIAUTOS" style="height:36px;display:block"></a>
    <div style="display:flex;align-items:center;gap:20px;flex:1;justify-content:flex-end;color:var(--t-2)">
      <svg class="mnd-theme-btn" style="cursor:pointer" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8Z" stroke-linejoin="round"></path></svg>
      <a href="Login.dc.html" aria-label="Iniciar sesión" style="display:flex;color:inherit"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="3.6"></circle><path d="M5.5 20a6.5 6.5 0 0 1 13 0" stroke-linecap="round"></path></svg></a>
    </div>
  </header>

  <div data-mnd-back style="max-width:1280px;margin:0 auto;padding:16px 34px 0"><button type="button" onclick="if(document.referrer&&document.referrer!==location.href){location.href=document.referrer}else if(history.length>1){history.back()}else{location.href='MendiautosHome.dc.html'}" style="display:inline-flex;align-items:center;gap:8px;background:transparent;border:0;padding:6px 2px;cursor:pointer;color:var(--t-3);font:600 11px/1 'Open Sans',sans-serif;letter-spacing:.16em;text-transform:uppercase;transition:color .3s ease" onmouseover="this.style.color='var(--t-strong)';this.querySelector('svg').style.transform='translateX(-3px)'" onmouseout="this.style.color='var(--t-3)';this.querySelector('svg').style.transform='none'"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" style="transition:transform .3s ease"><path d="M15 6l-6 6 6 6" stroke-linecap="round" stroke-linejoin="round"></path></svg>Volver</button></div>

  <main style="padding:34px 34px 80px">
    <span style="display:block;width:44px;height:2px;background:#1E50A2"></span>
    <h1 class="mnd-mich" style="margin:16px 0 0;font-size:clamp(26px,3.2vw,38px);line-height:1.05;color:var(--t-strong);text-transform:uppercase">Panel de inventario</h1>
    <p style="margin:14px 0 0;max-width:560px;font:400 15px/1.7 'Open Sans',sans-serif;color:var(--t-2)">Cambia cualquier vehículo de <b style="color:#2fa86a">Disponible</b> a <b style="color:#2f6fd0">Vendido</b> con un clic. El cambio se refleja en las páginas de Autos disponibles y Vendidos.</p>

    <div style="display:flex;gap:24px;margin-top:26px;border-bottom:1px solid var(--ln)">
      <button class="mnd-tabx on" data-f="todos">Todos <span class="mnd-c-todos"></span></button>
      <button class="mnd-tabx" data-f="disponible">Disponibles <span class="mnd-c-disp"></span></button>
      <button class="mnd-tabx" data-f="vendido">Vendidos <span class="mnd-c-vend"></span></button>
    </div>

    <div class="mnd-list" style="margin-top:24px;display:flex;flex-direction:column;gap:12px"></div>

    <div style="margin-top:26px;display:flex;gap:12px;flex-wrap:wrap">
      <button class="mnd-reset" style="border:1px solid var(--ln-strong);background:transparent;color:var(--t-3);border-radius:9px;padding:12px 20px;font:700 10.5px/1 'Open Sans',sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer">Restablecer cambios</button>
    </div>
  </main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800}}">
class Component extends DCLogic {
  componentDidMount(){
    let saved='dark'; try{ saved=localStorage.getItem('mnd-theme')||'dark'; }catch(e){}
    this._applyTheme(saved);
    document.querySelectorAll('.mnd-theme-btn').forEach(b=>b.onclick=(e)=>{e.preventDefault();this._applyTheme(window.__mndTheme==='light'?'dark':'light');});
    this._base=(window.MND_INVENTARIO||[]).map(c=>({...c}));
    this._overrides=this._readOverrides();
    this._edits=this._readEdits();
    this._filter='todos';
    document.querySelectorAll('.mnd-tabx').forEach(t=>t.onclick=()=>{ document.querySelectorAll('.mnd-tabx').forEach(x=>x.classList.remove('on')); t.classList.add('on'); this._filter=t.dataset.f; this._render(); });
    document.querySelector('.mnd-reset').onclick=()=>{ try{ localStorage.removeItem('mnd-estado-overrides'); localStorage.removeItem('mnd-edits'); }catch(e){} this._overrides={}; this._edits={}; this._render(); };
    this._render();
  }
  _readOverrides(){ try{ return JSON.parse(localStorage.getItem('mnd-estado-overrides')||'{}'); }catch(e){ return {}; } }
  _writeOverrides(){ try{ localStorage.setItem('mnd-estado-overrides',JSON.stringify(this._overrides)); }catch(e){} }
  _readEdits(){ try{ return JSON.parse(localStorage.getItem('mnd-edits')||'{}'); }catch(e){ return {}; } }
  _writeEdits(){ try{ localStorage.setItem('mnd-edits',JSON.stringify(this._edits)); }catch(e){} }
  _estado(c){ return this._overrides[c.id]||c.estado; }
  _fmt(n){ return '$'+Math.round(n).toLocaleString('es-CO'); }
  _render(){
    const list=document.querySelector('.mnd-list'); list.innerHTML='';
    const cars=this._base.map(c=>({...c,estado:this._estado(c)}));
    const disp=cars.filter(c=>c.estado==='disponible').length, vend=cars.filter(c=>c.estado==='vendido').length;
    document.querySelector('.mnd-c-todos').textContent='('+cars.length+')';
    document.querySelector('.mnd-c-disp').textContent='('+disp+')';
    document.querySelector('.mnd-c-vend').textContent='('+vend+')';
    const shown=cars.filter(c=>this._filter==='todos'||c.estado===this._filter);
    if(!shown.length){ list.innerHTML='<div style="padding:30px;text-align:center;font:400 14px/1.6 \'Open Sans\',sans-serif;color:var(--t-3)">Sin vehículos en esta vista.</div>'; return; }
    shown.forEach(c=>{
      const est=c.estado;
      const ov=this._overrides[c.id]||{};
      const desc=(this._edits[c.id]&&this._edits[c.id].desc!=null)?this._edits[c.id].desc:(c.descripcion||'SUV turbo, único dueño, mantenimientos al día. Ideal para ciudad y carretera.');
      const precio=(this._edits[c.id]&&this._edits[c.id].precio!=null)?this._edits[c.id].precio:c.precio;
      const wrap=document.createElement('div');
      const row=document.createElement('div'); row.className='mnd-row';
      row.innerHTML='<div style="display:flex;align-items:center;gap:16px">'
        +'<div style="width:64px;height:48px;border-radius:8px;flex:none;background:repeating-linear-gradient(45deg,#17130f 0 12px,#211b16 12px 24px)"></div>'
        +'<div><div style="font:700 15px/1.2 \'Open Sans\',sans-serif;color:var(--t-strong)">'+c.marca+' '+c.modelo+' '+(c.version||'')+'</div>'
        +'<div style="margin-top:5px;font:400 12px/1 \'Open Sans\',sans-serif;color:var(--t-3)">'+c.anio+' · '+c.km.toLocaleString('es-CO')+' km · '+this._fmt(precio)+'</div></div></div>'
        +'<span class="mnd-badge '+(est==='disponible'?'disp':'vend')+'">'+(est==='disponible'?'Disponible':'Vendido')+'</span>'
        +'<button class="mnd-edit-btn">Editar</button>'
        +'<button class="mnd-toggle">'+(est==='disponible'?'Marcar vendido':'Volver a disponible')+'</button>';
      const panel=document.createElement('div'); panel.className='mnd-edit-panel'; panel.style.marginTop='0';
      panel.innerHTML='<div style="border:1px solid var(--ln);border-top:0;border-radius:0 0 12px 12px;padding:20px;background:var(--c-card);margin-top:-6px">'
        +'<div style="display:grid;grid-template-columns:1fr 200px;gap:16px">'
        +'<div><label class="mnd-elab">Descripción</label><textarea class="mnd-edit-fld mnd-e-desc" rows="3" style="resize:vertical">'+desc.replace(/</g,'&lt;')+'</textarea></div>'
        +'<div><label class="mnd-elab">Precio</label><input class="mnd-edit-fld mnd-e-precio" inputmode="numeric" value="'+this._fmt(precio)+'"></div>'
        +'</div>'
        +'<div style="display:flex;gap:10px;margin-top:14px"><button class="mnd-e-save" style="background:#1E50A2;color:#fff;border:0;border-radius:9px;padding:11px 22px;font:700 10.5px/1 \'Open Sans\',sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer">Guardar</button><span class="mnd-e-ok" style="display:none;align-self:center;font:600 12px/1 \'Open Sans\',sans-serif;color:#2fa86a">✓ Guardado</span></div>'
        +'</div>';
      row.querySelector('.mnd-toggle').onclick=()=>{ this._overrides[c.id] = est==='disponible'?'vendido':'disponible'; this._writeOverrides(); this._render(); };
      row.querySelector('.mnd-edit-btn').onclick=()=>{ const open=panel.classList.toggle('open'); if(open){ panel.style.maxHeight=panel.scrollHeight+'px'; panel.style.opacity='1'; } else { panel.style.maxHeight='0'; panel.style.opacity='0'; } };
      panel.querySelector('.mnd-e-save').onclick=()=>{
        const nd=panel.querySelector('.mnd-e-desc').value;
        const np=+(panel.querySelector('.mnd-e-precio').value.replace(/[^0-9]/g,''))||precio;
        this._edits[c.id]={desc:nd,precio:np}; this._writeEdits();
        panel.querySelector('.mnd-e-ok').style.display='inline';
        const dsub=row.querySelector('.mnd-row>div>div>div:last-child'); if(dsub) dsub.textContent=c.anio+' · '+c.km.toLocaleString('es-CO')+' km · '+this._fmt(np);
      };
      wrap.appendChild(row); wrap.appendChild(panel);
      list.appendChild(wrap);
    });
  }
  _applyTheme(theme){
    window.__mndTheme=theme; try{localStorage.setItem('mnd-theme',theme);}catch(e){}
    if(theme==='light') document.body.setAttribute('data-theme','light'); else document.body.removeAttribute('data-theme');
    document.querySelectorAll('.mnd-theme-btn').forEach(btn=>{ btn.innerHTML = theme==='light'
      ? '<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6 19 19M19 5l-1.4 1.4M6.4 17.6 5 19" stroke-linecap="round"></path>'
      : '<path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8Z" stroke-linejoin="round"></path>'; });
  }
}
</script>
</body>
</html>
