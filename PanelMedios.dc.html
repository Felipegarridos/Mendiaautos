<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<link rel="stylesheet" href="assets/site.css">
<script src="assets/site.js" defer></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&family=Michroma&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  :root{--bg:#0c0c0e;--c-card:#161619;--c-input:#161619;--t-strong:#fff;--t-1:rgba(255,255,255,.8);--t-2:rgba(255,255,255,.58);--t-3:rgba(255,255,255,.42);--ln:rgba(255,255,255,.09);--ln-strong:rgba(255,255,255,.2)}
  body[data-theme="light"]{--bg:#fff;--c-card:#fff;--c-input:#f6f6f7;--t-strong:#0e0e10;--t-1:rgba(14,14,16,.82);--t-2:rgba(14,14,16,.56);--t-3:rgba(14,14,16,.44);--ln:rgba(0,0,0,.09);--ln-strong:rgba(0,0,0,.16)}
  body{margin:0;background:var(--bg);font-family:'Open Sans',system-ui,sans-serif;color:var(--t-1);transition:background .35s,color .35s}
  a{color:inherit;text-decoration:none}
  a:hover{color:#1E50A2}
  .mnd-mich{font-family:'Michroma',sans-serif}
  .mnd-sec{border:1px solid var(--ln);border-radius:16px;background:var(--c-card);overflow:hidden}
  .mnd-sec-head{display:flex;align-items:center;gap:14px;padding:18px 22px;cursor:pointer;transition:background .2s}
  .mnd-sec-head:hover{background:rgba(30,80,162,.05)}
  .mnd-sec-num{flex:none;width:34px;height:34px;border-radius:50%;background:rgba(30,80,162,.14);color:#2f6fd0;display:flex;align-items:center;justify-content:center;font:800 13px/1 'Open Sans',sans-serif}
  .mnd-sec-body{overflow:hidden;max-height:0;opacity:0;transition:max-height .5s cubic-bezier(.22,1,.36,1),opacity .4s ease}
  .mnd-up{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border:1px dashed var(--ln-strong);border-radius:12px;padding:22px 16px;cursor:pointer;text-align:center;transition:border-color .25s,background .25s}
  .mnd-up:hover{border-color:#1E50A2;background:rgba(30,80,162,.04)}
  .mnd-up.filled{border-style:solid;border-color:#1E50A2}
  .mnd-up-ico{width:42px;height:42px;border-radius:11px;background:var(--c-input);display:flex;align-items:center;justify-content:center;color:#1E50A2}
  .mnd-chev{transition:transform .4s cubic-bezier(.22,1,.36,1);color:var(--t-3)}
  .mnd-sec.open .mnd-chev{transform:rotate(180deg);color:#2f6fd0}
</style>
</helmet>
<div style="background:var(--bg);width:100%;max-width:1280px;margin:0 auto;overflow:hidden">

  <header class="r-px" style="position:sticky;top:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:16px 34px;border-bottom:1px solid var(--ln)">
    <a href="MendiautosHome.dc.html" style="display:flex;align-items:center;gap:12px;flex:1"><span style="display:flex;flex-direction:column;gap:4px"><span style="width:22px;height:2px;background:var(--t-strong)"></span><span style="width:22px;height:2px;background:var(--t-strong)"></span><span style="width:22px;height:2px;background:var(--t-strong)"></span></span><span style="font:600 12px/1 'Open Sans',sans-serif;letter-spacing:.24em;color:var(--t-2)">MENÚ</span></a>
    <a href="MendiautosHome.dc.html" style="flex:0 0 auto"><img src="assets/logo-word.png" alt="MENDIAUTOS" style="height:36px;display:block"></a>
    <div style="display:flex;align-items:center;gap:20px;flex:1;justify-content:flex-end;color:var(--t-2)">
      <svg class="mnd-theme-btn" style="cursor:pointer" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8Z" stroke-linejoin="round"></path></svg>
      <a href="Login.dc.html" aria-label="Iniciar sesión" style="display:flex;color:inherit"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="3.6"></circle><path d="M5.5 20a6.5 6.5 0 0 1 13 0" stroke-linecap="round"></path></svg></a>
    </div>
  </header>

  <div class="r-px" data-mnd-back style="max-width:1280px;margin:0 auto;padding:16px 34px 0"><button type="button" style="display:inline-flex;align-items:center;gap:8px;background:transparent;border:0;padding:6px 2px;cursor:pointer;color:var(--t-3);font:600 11px/1 'Open Sans',sans-serif;letter-spacing:.16em;text-transform:uppercase;transition:color .3s ease" style-hover="color:var(--t-strong)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" style="transition:transform .3s ease"><path d="M15 6l-6 6 6 6" stroke-linecap="round" stroke-linejoin="round"></path></svg>Volver</button></div>

  <main class="r-px" style="padding:28px 34px 80px">
    <span style="display:block;width:44px;height:2px;background:#1E50A2"></span>
    <h1 class="mnd-mich" style="margin:16px 0 0;font-size:clamp(26px,3.2vw,38px);line-height:1.05;color:var(--t-strong);text-transform:uppercase">Medios del sitio</h1>
    <p style="margin:14px 0 0;max-width:620px;font:400 15px/1.7 'Open Sans',sans-serif;color:var(--t-2)">Sube el <b style="color:var(--t-strong)">video</b> y la <b style="color:var(--t-strong)">foto de portada</b> de cada página del sitio. Cada bloque indica exactamente a qué sección pertenece. (Estas son las imágenes/videos de las páginas, no las fotos de los autos.)</p>
    <div class="mnd-secs" style="margin-top:26px;display:flex;flex-direction:column;gap:14px"></div>
  </main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900}}">
class Component extends DCLogic {
  componentDidMount(){
    let saved='dark'; try{ saved=localStorage.getItem('mnd-theme')||'dark'; }catch(e){}
    this._applyTheme(saved);
    document.querySelectorAll('.mnd-theme-btn').forEach(b=>b.onclick=(e)=>{e.preventDefault();this._applyTheme(window.__mndTheme==='light'?'dark':'light');});
    this._secs=[
      {t:'Inicio (Home)', d:'Video del hero, fotos de las tarjetas de categoría y foto de la sección "sobre Mendiautos".', videos:[{n:'Video del hero'}], fotos:[{n:'Foto tarjeta · Autos disponibles'},{n:'Foto tarjeta · Otros servicios'},{n:'Foto tarjeta · Comparar coches'},{n:'Foto tarjeta · Vende tu auto'},{n:'Foto tarjeta · Autos vendidos'},{n:'Foto sección "sobre Mendiautos"'}]},
      {t:'Autos disponibles', d:'Foto de cabecera del catálogo de autos disponibles.', videos:[], fotos:[{n:'Foto de cabecera'}]},
      {t:'Autos vendidos', d:'Foto de cabecera del archivo de autos vendidos.', videos:[], fotos:[{n:'Foto de cabecera'}]},
      {t:'Vende tu auto', d:'Foto de portada de "Vende tu auto". (El video explicativo va en la biblioteca Aprende.)', videos:[], fotos:[{n:'Foto de portada'}]},
      {t:'Compra inmediata', d:'Foto de portada de compra inmediata. (Video en Aprende.)', videos:[], fotos:[{n:'Foto de portada'}]},
      {t:'Consignación física', d:'Foto de portada de consignación física. (Video en Aprende.)', videos:[], fotos:[{n:'Foto de portada'}]},
      {t:'Consignación virtual', d:'Foto de portada de consignación virtual. (Video en Aprende.)', videos:[], fotos:[{n:'Foto de portada'}]},
      {t:'Créditos', d:'Foto de portada de la página de créditos. (Video en Aprende.)', videos:[], fotos:[{n:'Foto de portada'}]},
      {t:'El inversionista', d:'Foto de portada del modelo de inversión. (Video en Aprende.)', videos:[], fotos:[{n:'Foto de portada'}]},
      {t:'Sobre nosotros', d:'Fotos del hero, el equipo y la sala de exposición (Misión/Visión).', videos:[], fotos:[{n:'Foto del hero'},{n:'Foto del equipo'},{n:'Foto sala de exposición (Misión/Visión)'}]},
      {t:'Otros servicios', d:'Un video por cada servicio (4) y foto de portada. ESTA PÁGINA SÍ MUESTRA VIDEOS.', videos:[{n:'Video · Acompañamiento posventa'},{n:'Video · Servicios de tránsito'},{n:'Video · Fotografía profesional'},{n:'Video · Acompañamiento de compra'}], fotos:[{n:'Foto de portada'}]},
      {t:'Busca tu auto', d:'Foto de portada de la página "Busca tu auto".', videos:[], fotos:[{n:'Foto de portada'}]},
      {t:'Aprende (biblioteca de videos)', d:'Aquí van TODOS los videos educativos del sitio (uno por tema). Puedes subir varios.', videos:[{n:'Videos educativos (varios)', multi:true}], fotos:[{n:'Foto de portada'}]},
      {t:'Contacto', d:'Foto de la sala de exposición para la página de contacto.', videos:[], fotos:[{n:'Foto de la sala de exposición'}]}
    ];
    this._render();
  }
  _render(){
    const wrap=document.querySelector('.mnd-secs'); wrap.innerHTML='';
    this._secs.forEach((s,i)=>{
      const sec=document.createElement('div'); sec.className='mnd-sec';
      const slots=[];
      (s.videos||[]).forEach(v=>slots.push(this._slot(v.n,(v.multi?'MP4 · varios archivos':'MP4 · alta resolución'),'video/*','<rect x="3" y="6" width="14" height="12" rx="2"></rect><path d="m17 10 4-2v8l-4-2z" stroke-linejoin="round"></path>',v.multi)));
      (s.fotos||[]).forEach(f=>slots.push(this._slot(f.n,'JPG/PNG · horizontal','image/*','<rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="m4 18 5-5 4 4 3-3 4 4" stroke-linecap="round" stroke-linejoin="round"></path>',false)));
      const nv=(s.videos||[]).length, nf=(s.fotos||[]).length;
      const tag = nv&&nf ? nv+' video'+(nv>1?'s':'')+' + '+nf+' foto'+(nf>1?'s':'') : nv ? nv+' video'+(nv>1?'s':'') : nf+' foto'+(nf>1?'s':'');
      const cols = slots.length>=2 ? '1fr 1fr' : '1fr';
      sec.innerHTML='<div class="mnd-sec-head"><span class="mnd-sec-num">'+String(i+1).padStart(2,'0')+'</span>'
        +'<div style="flex:1"><div class="mnd-mich" style="font-size:15px;color:var(--t-strong);text-transform:uppercase">'+s.t+'</div><div style="margin-top:5px;font:400 12.5px/1.5 \'Open Sans\',sans-serif;color:var(--t-3)">'+s.d+'</div></div>'
        +'<span style="flex:none;font:600 10px/1 \'Open Sans\',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--t-3)">'+tag+'</span>'
        +'<svg class="mnd-chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"></path></svg></div>'
        +'<div class="mnd-sec-body"><div class="r-stack-xs" style="padding:0 22px 22px;display:grid;grid-template-columns:'+cols+';gap:14px">'+slots.join('')+'</div></div>';
      const head=sec.querySelector('.mnd-sec-head'), body=sec.querySelector('.mnd-sec-body');
      head.onclick=()=>{ const open=sec.classList.toggle('open'); if(open){ body.style.maxHeight=body.scrollHeight+'px'; body.style.opacity='1'; } else { body.style.maxHeight='0'; body.style.opacity='0'; } };
      sec.querySelectorAll('input[type=file]').forEach(inp=>inp.addEventListener('change',()=>{
        const box=inp.closest('.mnd-up'), sub=box.querySelector('.mnd-up-s');
        if(inp.files&&inp.files.length){ box.classList.add('filled'); sub.textContent=inp.files[0].name; }
        else box.classList.remove('filled');
        body.style.maxHeight=body.scrollHeight+'px';
      }));
      wrap.appendChild(sec);
    });
  }
  _slot(title,sub,accept,icoPath,multi){
    return '<label class="mnd-up"><span class="mnd-up-ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">'+icoPath+'</svg></span>'
      +'<span style="font:700 13px/1.3 \'Open Sans\',sans-serif;color:var(--t-strong)">'+title+'</span>'
      +'<span class="mnd-up-s" style="font:400 11px/1.4 \'Open Sans\',sans-serif;color:var(--t-3)">'+sub+'</span>'
      +'<input type="file" accept="'+accept+'"'+(multi?' multiple':'')+' hidden></label>';
  }
  _applyTheme(theme){
    window.__mndTheme=theme; try{localStorage.setItem('mnd-theme',theme);}catch(e){}
    if(theme==='light') document.body.setAttribute('data-theme','light'); else document.body.removeAttribute('data-theme');
    document.querySelectorAll('.mnd-theme-btn').forEach(btn=>{ btn.innerHTML = theme==='light'
      ? '<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6 19 19M19 5l-1.4 1.4M6.4 17.6 5 19" stroke-linecap="round"></path>'
      : '<path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8Z" stroke-linejoin="round"></path>'; });
  }
}
</script>
</body>
</html>
